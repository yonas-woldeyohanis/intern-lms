
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-bmvei_lms}
      MYSQL_USER: ${DB_USER:-bmvei_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-bmvei_lms}
      - DB_USER=${DB_USER:-bmvei_app}
      - DB_PASSWORD=${DB_PASSWORD:-change_me_strong_password}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-bmvei_lms_access_secret_key_2026_secure}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-bmvei_lms_refresh_secret_key_2026_secure}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@bmvei.local}
      - ADMIN_DEFAULT_USERNAME=${ADMIN_DEFAULT_USERNAME:-admin}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-ChangeMe@12345}
      - NODE_ENV=development
      - CLIENT_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  backend_uploads:
